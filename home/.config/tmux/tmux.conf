# Set the command used for new windows (if not specified when the window is
# created) to shell-command, which may be any sh(1) command. The default is an
# empty string, which instructs tmux to create a login shell using the value of
# the default-shell option.
set-option -g default-command "exec fish"

# Specify the full path of an executable of shell to be used as the login shell
# for new windows when the default-command option is set to empty. When
# started, tmux tries to set this to the first suitable shell in this order:
# $SHELL, getpwuid(3) or /bin/sh. Use this if using tmux as a login shell.
    # default-shell path


# Attempt to set the terminal clipboard content using the xterm(1) escape
# sequence, if there is an Ms entry in the terminfo(5) description (see the
# “TERMINFO EXTENSIONS” section). If set to on, tmux will both accept the
# escape sequence to create a buffer and attempt to set the terminal clipboard.
#
# Note that this feature needs to be enabled in xterm(1) by setting the
# resource:
#     disallowedWindowOps: 20,21,SetXprop
set-option -g set-clipboard on

# If on, tmux captures the mouse and allows mouse events to be bound as key
# bindings. See the “MOUSE SUPPORT” section for details.
set-option -g mouse on

# key bindings to use in copy mode. Defaults to emacs, unless VISUAL/EDITOR
# contains `vi`.
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
